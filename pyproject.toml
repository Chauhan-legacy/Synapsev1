[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "SYNAPSE: Universal Signal Intelligence & Scientific Discovery Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SYNAPSE Scientific Computing Group"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "h5py>=3.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "packages", "connectors", "benchmarks", "apps"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["packages"]
